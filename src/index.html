<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社員テーブルサンプル</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="page-header">
  <h1 class="page-title">社員一覧</h1>
</header>

<!-- フィルターエリア -->
<div class="filter-bar" id="js-filter-bar">
  <label class="filter-label" for="js-dept-filter">部署で絞り込み:</label>
  <select class="filter-select" id="js-dept-filter">
    <option value="">全部</option>
  </select>
  <label class="filter-label" for="js-search-input">検索:</label>
  <input class="filter-search" id="js-search-input" type="text" placeholder="全体から検索...">
  <label class="filter-label" for="js-pagesize-select">表示件数:</label>
  <select class="filter-pagesize" id="js-pagesize-select">
    <option value="5">5</option>
    <option value="10">10</option>
    <option value="25">25</option>
    <option value="50">50</option>
  </select>
  <span class="filter-label">件</span>
</div>

<!-- テーブルエリア -->
<div class="tbl-scroll" id="js-wrap">
  <table class="tbl" id="js-table">
    <thead><tr id="js-thead-row"></tr></thead>
    <tbody id="js-tbody"></tbody>
  </table>
  <p class="tbl-empty" id="js-empty-msg" hidden>該当するデータがありません。</p>
</div>

<!-- ページネーション＆情報エリア -->
<div class="pagination-bar" id="js-pag-bar">
  <span class="pag-info" id="js-pag-info"></span>
  <div class="pag-btns" id="js-pag-btns"></div>
</div>

<script src="./script.js"></script>
</body>
</html>
